version: 2.1

# ─────────────────────────────────────────────────────────────
# Orbs - Pre-built CircleCI integrations
# ─────────────────────────────────────────────────────────────
orbs:
  android: circleci/android@3.0.1
  ruby: circleci/ruby@2.5.3
  node: circleci/node@7.1.0

# ─────────────────────────────────────────────────────────────
# Parameters - Control which environment to build
# ─────────────────────────────────────────────────────────────
parameters:
  environment:
    type: enum
    enum: ["dev", "uat", "production"]
    default: "dev"
    description: "Target environment for the build"

# ─────────────────────────────────────────────────────────────
# Commands - Reusable steps
# ─────────────────────────────────────────────────────────────
commands:
  setup-env:
    description: "Copy the correct .env file for the target environment"
    parameters:
      env_name:
        type: string
    steps:
      - run:
          name: Setup environment - << parameters.env_name >>
          command: |
            cp .env.<< parameters.env_name >> .env
            echo "Environment set to: << parameters.env_name >>"
            cat .env

  install-dependencies:
    description: "Install Node.js dependencies"
    steps:
      - restore_cache:
          keys:
            - node-deps-v1-{{ checksum "package-lock.json" }}
            - node-deps-v1-
      - run:
          name: Install npm dependencies
          command: npm ci
      - save_cache:
          key: node-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

  setup-fastlane:
    description: "Install Fastlane and dependencies"
    steps:
      - restore_cache:
          keys:
            - bundle-v1-{{ checksum "Gemfile.lock" }}
            - bundle-v1-
      - run:
          name: Install Fastlane
          command: bundle install
      - save_cache:
          key: bundle-v1-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

# ─────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────
jobs:
  # ── Lint & Test ──────────────────────────────────────────
  lint-and-test:
    docker:
      - image: cimg/node:22.11
    resource_class: medium
    steps:
      - checkout
      - install-dependencies
      - run:
          name: Run ESLint
          command: npm run lint
      - run:
          name: Run Jest tests
          command: npm run test -- --ci --coverage
      - store_test_results:
          path: coverage
      - store_artifacts:
          path: coverage

  # ── Android Build & Distribute ──────────────────────────
  build-android:
    parameters:
      env_name:
        type: string
      flavor:
        type: string
    docker:
      - image: cimg/android:2025.01-ndk
    resource_class: large
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx4g"
    steps:
      - checkout
      - install-dependencies
      - setup-env:
          env_name: << parameters.env_name >>

      # Decode keystore from env var (stored as base64 in CircleCI)
      - run:
          name: Decode Android keystore
          command: |
            if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
              echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
              echo "Keystore decoded successfully"
            else
              echo "⚠️  No keystore found, using debug keystore"
            fi

      # Restore Gradle cache
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "android/build.gradle" }}-{{ checksum "android/app/build.gradle" }}
            - gradle-v1-

      # Build APK
      - run:
          name: Build Android APK (<< parameters.env_name >>)
          command: |
            cd android
            ./gradlew assemble<< parameters.flavor >>Release \
              -PENVFILE=../.env.<< parameters.env_name >> \
              --no-daemon \
              --stacktrace

      # Save Gradle cache
      - save_cache:
          key: gradle-v1-{{ checksum "android/build.gradle" }}-{{ checksum "android/app/build.gradle" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      # Store APK artifact
      - store_artifacts:
          path: android/app/build/outputs/apk
          destination: apk

      # Distribute to Firebase
      - setup-fastlane
      - run:
          name: Distribute Android to Firebase App Distribution
          command: |
            cd android
            bundle exec fastlane distribute_<< parameters.env_name >>
          environment:
            FIREBASE_TOKEN: $FIREBASE_TOKEN

  # ── iOS Build & Distribute ─────────────────────────────
  build-ios:
    parameters:
      env_name:
        type: string
      scheme:
        type: string
    macos:
      xcode: "16.2.0"
    resource_class: macos.m1.medium.gen1
    environment:
      FL_OUTPUT_DIR: output
    steps:
      - checkout
      - install-dependencies
      - setup-env:
          env_name: << parameters.env_name >>

      # Install CocoaPods
      - restore_cache:
          keys:
            - pods-v1-{{ checksum "ios/Podfile.lock" }}
            - pods-v1-
      - run:
          name: Install CocoaPods
          command: |
            cd ios
            bundle install
            bundle exec pod install
      - save_cache:
          key: pods-v1-{{ checksum "ios/Podfile.lock" }}
          paths:
            - ios/Pods

      # Build IPA
      - run:
          name: Build iOS IPA (<< parameters.env_name >>)
          command: |
            cd ios
            bundle exec fastlane distribute_<< parameters.env_name >>
          environment:
            MATCH_PASSWORD: $MATCH_PASSWORD
            FIREBASE_TOKEN: $FIREBASE_TOKEN

      # Store IPA artifact
      - store_artifacts:
          path: ios/output
          destination: ipa

# ─────────────────────────────────────────────────────────────
# Workflows
# ─────────────────────────────────────────────────────────────
workflows:
  version: 2

  # ── Dev workflow - Triggered on feature branches ────────
  dev-build:
    when:
      equal: ["dev", << pipeline.parameters.environment >>]
    jobs:
      - lint-and-test:
          filters:
            branches:
              only:
                - develop
                - /feature\/.*/
      - build-android:
          env_name: dev
          flavor: dev
          requires:
            - lint-and-test
          context: firebase-dev
      - build-ios:
          env_name: dev
          scheme: SampleApp-Dev
          requires:
            - lint-and-test
          context: firebase-dev

  # ── UAT workflow - Triggered on release branches ────────
  uat-build:
    when:
      equal: ["uat", << pipeline.parameters.environment >>]
    jobs:
      - lint-and-test:
          filters:
            branches:
              only:
                - /release\/.*/
                - staging
      - build-android:
          env_name: uat
          flavor: uat
          requires:
            - lint-and-test
          context: firebase-uat
      - build-ios:
          env_name: uat
          scheme: SampleApp-UAT
          requires:
            - lint-and-test
          context: firebase-uat

  # ── Production workflow - Triggered on main branch ──────
  production-build:
    when:
      equal: ["production", << pipeline.parameters.environment >>]
    jobs:
      - lint-and-test:
          filters:
            branches:
              only:
                - main
                - master
      - build-android:
          env_name: production
          flavor: production
          requires:
            - lint-and-test
          context: firebase-production
      - build-ios:
          env_name: production
          scheme: SampleApp-Production
          requires:
            - lint-and-test
          context: firebase-production
