          include: true
        - pattern: 'release/*'
          include: true
      cancel_previous_builds: true

    environment:
      <<: *android_env
      groups:
        - firebase_credentials
        - android_signing_uat
      vars:
        ENVFILE: .env.uat
        FIREBASE_APP_ID_ANDROID: "1:858015635135:android:ef07a06bee88ba0c7ad80a"
        BUILD_FLAVOR: uat
        APP_ENV: uat

    scripts:
      - *install_deps
      - *run_lint
