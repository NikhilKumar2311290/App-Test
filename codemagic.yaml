# ─────────────────────────────────────────────────────────────
# Codemagic CI/CD Configuration
# SampleApp - React Native with 3 Environments (dev/uat/production)
# Builds Android & iOS, distributes via Firebase App Distribution
# ─────────────────────────────────────────────────────────────

definitions:
  # ── Reusable environment variables ──────────────────────
  environment:
    &android_env
    node: 22.11.0
    npm: latest
    java: 17
    android_signing:
      - &android_keystore_dev
        keystore_reference: keystore_dev
      - &android_keystore_uat
        keystore_reference: keystore_uat
      - &android_keystore_prod
        keystore_reference: keystore_prod

  # ── Reusable scripts ───────────────────────────────────
  scripts:
    - &install_deps
      name: Install dependencies
      script: |
        npm ci

    - &run_tests
      name: Run tests
      script: |
        npm run test -- --ci --coverage || true

    - &run_lint
      name: Run ESLint
      script: |
        npm run lint || true

# ─────────────────────────────────────────────────────────────
# Workflows
# ─────────────────────────────────────────────────────────────
workflows:

  # ══════════════════════════════════════════════════════════
  # DEV - Android Build
  # ══════════════════════════════════════════════════════════
  android-dev:
    name: Android Dev Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
        - pattern: 'feature/*'
          include: true
      cancel_previous_builds: true

    environment:
      <<: *android_env
      groups:
        - firebase_credentials  # FIREBASE_TOKEN
        - android_signing_dev   # Keystore credentials
      vars:
        ENVFILE: .env.dev
        FIREBASE_APP_ID_ANDROID: "1:858015635135:android:ef07a06bee88ba0c7ad80a"
        BUILD_FLAVOR: dev
        APP_ENV: dev

    scripts:
      - *install_deps
      - *run_lint
      - *run_tests

      - name: Set up environment file
        script: |
          cp .env.dev .env
          echo "Environment: dev"
          cat .env

      - name: Set Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build Android APK (Dev)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDevRelease \
            -PENVFILE=../.env.dev \
            --no-daemon \
            --stacktrace

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/mapping.txt

    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT_JSON
        android:
          app_id: "1:858015635135:android:ef07a06bee88ba0c7ad80a"
          groups:
            - dev-testers
          artifact_type: apk
      email:
        recipients:
          - nikhil23111-admin@gmail.com
        notify:
          success: true
          failure: true

  # ══════════════════════════════════════════════════════════
  # UAT - Android Build
  # ══════════════════════════════════════════════════════════
  android-uat:
    name: Android UAT Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
