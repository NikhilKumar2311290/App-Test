  # ══════════════════════════════════════════════════════════
  # DEV - iOS Build
  # ══════════════════════════════════════════════════════════
  ios-dev:
    name: iOS Dev Build
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_app_store
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
        - pattern: 'feature/*'
          include: true
      cancel_previous_builds: true

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.sampleapp.dev
      node: 22.11.0
      npm: latest
      xcode: latest
      cocoapods: default
      groups:
        - firebase_credentials
      vars:
        ENVFILE: .env.dev
        APP_ENV: dev
        BUNDLE_ID: com.sampleapp.dev

    scripts:
      - *install_deps
      - *run_lint
      - *run_tests

      - name: Set up environment file
        script: |
          cp .env.dev .env

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Set up code signing
        script: |
          keychain initialize

      - name: Build iOS IPA (Dev)
        script: |
          cd ios
          xcodebuild -workspace SampleApp.xcworkspace \
            -scheme SampleApp \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath $CM_BUILD_DIR/build/SampleApp-dev.xcarchive \
            archive \
            ENVFILE=../.env.dev

          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/SampleApp-dev.xcarchive \
            -exportOptionsPlist /tmp/export_options.plist \
            -exportPath $CM_BUILD_DIR/build/ios

    artifacts:
      - build/ios/**/*.ipa
      - build/*.xcarchive

    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT_JSON
        ios:
          app_id: $FIREBASE_APP_ID_IOS
          groups:
            - dev-testers
      email:
        recipients:
          - nikhil23111-admin@gmail.com
        notify:
          success: true
          failure: true

