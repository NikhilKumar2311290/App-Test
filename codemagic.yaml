      - android/app/build/outputs/**/mapping.txt

    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT_JSON
        android:
          app_id: "1:858015635135:android:ef07a06bee88ba0c7ad80a"
          groups:
            - uat-testers
          artifact_type: apk
      email:
        recipients:
          - nikhil23111-admin@gmail.com
        notify:
          success: true
          failure: true

  # ══════════════════════════════════════════════════════════
  # PRODUCTION - Android Build
  # ══════════════════════════════════════════════════════════
  android-production:
    name: Android Production Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
